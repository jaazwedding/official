<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jawad & Shabistha | Royal Wedding Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
height:100vh;overflow:hidden;display:grid;place-items:center;
background:
radial-gradient(circle at 50% 0%,rgba(212,175,55,.10),transparent 45%),
linear-gradient(#111,#050505 60%,#000);
font-family:Poppins,sans-serif;color:#fff;
}
canvas{position:fixed;inset:0}
.hero{position:relative;z-index:2;text-align:center;width:min(1400px,95%)}
.monogram{
width:170px;height:170px;margin:0 auto 22px;border-radius:50%;
display:grid;place-items:center;
font:700 34px Cinzel;
color:#f8e6ab;
border:1px solid rgba(212,175,55,.4);
background:rgba(255,255,255,.04);
backdrop-filter:blur(10px);
box-shadow:0 0 40px rgba(212,175,55,.15);
animation:float 8s ease-in-out infinite;
}
.rule{width:340px;max-width:70%;height:1px;margin:20px auto;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
.title{
font:900 clamp(3rem,6vw,6.3rem) Cinzel;
letter-spacing:8px;
background:linear-gradient(180deg,#fffef8,#ffe9a6,#ca941b,#fff2c1);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 18px rgba(212,175,55,.18));
animation:breathe 6s ease-in-out infinite;
}
.subtitle{margin:20px 0 40px;font:500 .95rem Cinzel;letter-spacing:10px;color:#d8bb62}
.row{display:flex;justify-content:center;gap:20px;flex-wrap:nowrap}
.card{
width:180px;padding:26px;border-radius:28px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border:1px solid rgba(212,175,55,.4);
box-shadow:0 0 30px rgba(212,175,55,.15), inset 0 0 18px rgba(255,255,255,.03);
transition:.35s;
}
.card:hover{transform:translateY(-8px);box-shadow:0 0 45px rgba(212,175,55,.3)}
.value{font:700 4rem Cinzel;color:#ffe7a4}
.label{margin-top:8px;font-size:.82rem;letter-spacing:4px;color:#e6cf91}
.date{margin-top:34px;color:#d7b96c;letter-spacing:3px}
@keyframes breathe{
0%,100%{filter:drop-shadow(0 0 14px rgba(212,175,55,.12))}
50%{filter:drop-shadow(0 0 28px rgba(212,175,55,.32))}
}
@keyframes float{50%{transform:translateY(-6px)}}
@media(max-width:1000px){.row{flex-wrap:wrap}.card{width:42%}}
@media(max-width:600px){.card{width:46%}.title{letter-spacing:3px;font-size:2.6rem}}

.title{
position:relative;
display:inline-block;
overflow:hidden;
}
.title::after{
content:"";
position:absolute;
top:-20%;
left:-35%;
width:25%;
height:140%;
background:linear-gradient(
90deg,
rgba(255,255,255,0),
rgba(255,255,255,.15),
rgba(255,255,255,.85),
rgba(255,255,255,.15),
rgba(255,255,255,0)
);
transform:skewX(-22deg);
filter:blur(1px);
animation:luxuryShine 5.5s ease-in-out infinite;
pointer-events:none;
}
@keyframes luxuryShine{
0%{left:-40%;opacity:0}
8%{opacity:1}
45%{left:120%;opacity:1}
60%{opacity:0}
100%{left:120%;opacity:0}
}


.card{position:relative;overflow:hidden}
.card::after{
content:"";
position:absolute;
top:-15%;
left:-45%;
width:28%;
height:140%;
background:linear-gradient(
90deg,
rgba(255,255,255,0),
rgba(255,255,255,.10),
rgba(255,255,255,.70),
rgba(255,255,255,.10),
rgba(255,255,255,0)
);
transform:skewX(-22deg);
filter:blur(1px);
animation:cardShine 6.5s ease-in-out infinite;
pointer-events:none;
}
.card:nth-child(2)::after{animation-delay:1.2s}
.card:nth-child(3)::after{animation-delay:2.4s}
.card:nth-child(4)::after{animation-delay:3.6s}

@keyframes cardShine{
0%{left:-45%;opacity:0}
8%{opacity:1}
42%{left:125%;opacity:1}
60%,100%{left:125%;opacity:0}
}


.logo-img{
width:100%;
height:100%;
object-fit:contain;
filter:drop-shadow(0 0 18px rgba(212,175,55,.35));
animation:logoGlow 5s ease-in-out infinite;
}
@keyframes logoGlow{
0%,100%{filter:drop-shadow(0 0 12px rgba(212,175,55,.25))}
50%{filter:drop-shadow(0 0 28px rgba(255,215,90,.55))}
}

</style>
</head>

<div class="subtitle">WEDDING COUNTDOWN</div>
<div class="row">
<div class="card"><div id="d" class="value">00</div><div class="label">DAYS</div></div>
<div class="card"><div id="h" class="value">00</div><div class="label">HOURS</div></div>
<div class="card"><div id="m" class="value">00</div><div class="label">MINUTES</div></div>
<div class="card"><div id="s" class="value">00</div><div class="label">SECONDS</div></div>
</div>
<div class="date">22 AUGUST 2026 • 4:00 PM</div>
</div>
<script>
const target=new Date("2026-08-22T16:00:00").getTime();
function tick(){
let t=Math.max(0,target-Date.now());
const D=Math.floor(t/86400000);t%=86400000;
const H=Math.floor(t/3600000);t%=3600000;
const M=Math.floor(t/60000);t%=60000;
const S=Math.floor(t/1000);
d.textContent=String(D).padStart(2,"0");
h.textContent=String(H).padStart(2,"0");
m.textContent=String(M).padStart(2,"0");
s.textContent=String(S).padStart(2,"0");
}
tick();setInterval(tick,1000);

const c=document.getElementById('bg'),x=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight}
rs();addEventListener('resize',rs);
const pts=[...Array(220)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+.5,v:.2+Math.random()*.6,a:.25+Math.random()*.6}));
(function loop(){
x.clearRect(0,0,c.width,c.height);
for(const p of pts){
p.y-=p.v;
if(p.y<0){p.y=c.height;p.x=Math.random()*c.width}
x.beginPath();
x.fillStyle=`rgba(212,175,55,${p.a})`;
x.shadowBlur=12;
x.shadowColor="#d4af37";
x.arc(p.x,p.y,p.r,0,Math.PI*2);
x.fill();
}
requestAnimationFrame(loop);
})();
</script>
